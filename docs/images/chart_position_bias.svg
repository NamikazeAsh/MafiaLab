<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="t d">
<title id="t">Shuffling fixed list position bias for one model, not the other</title><desc id="d">Shuffling fixed list position bias for one model, not the other. Detective check: 84.6% before, 29.4% after, 18.8% for 3.1 lite, shuffled, chance 22.2%. Mafia kill: 55.6% before, 33.3% after, 57.9% for 3.1 lite, shuffled, chance 27.1%. Doctor protection: 37.5% before, 13.6% after, 21.1% for 3.1 lite, shuffled, chance 20.2%. Day vote: 28.6% before, 31.7% after, 29.7% for 3.1 lite, shuffled, chance 28.3%.</desc>
