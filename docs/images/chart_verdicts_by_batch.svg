<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="t d">
<title id="t">The three batches look alike</title><desc id="d">The three batches look alike. Baseline, 3.5 lite (117 decisions): sound 64.1%, weak 33.3%, illogical 2.6%. Shuffled, 3.5 lite (145 decisions): sound 69.7%, weak 29.0%, illogical 1.4%. Shuffled, 3.1 lite (128 decisions): sound 68.8%, weak 29.7%, illogical 1.6%.</desc>
<style>
:root { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --accent:#2a78d6; --accent2:#eb6834; --border:rgba(11,11,11,.10); }
@media (prefers-color-scheme: dark) {
