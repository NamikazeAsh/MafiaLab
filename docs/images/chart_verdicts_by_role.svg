<title id="t">How each role&#x27;s decisions were rated</title><desc id="d">How each role&#x27;s decisions were rated. Villager (102 decisions): sound 20.6%, weak 76.5%, illogical 2.9%. Doctor (93 decisions): sound 72.0%, weak 24.7%, illogical 3.2%. Detective (80 decisions): sound 78.8%, weak 21.2%, illogical 0.0%. Mafia (115 decisions): sound 98.3%, weak 0.9%, illogical 0.9%.</desc>
<style>
